<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gas Price Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #e05c00;
      color: #fff;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header p  { font-size: 14px; opacity: .8; margin-top: 4px; }

    main { max-width: 760px; margin: 32px auto; padding: 0 16px; }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    button:active  { transform: scale(.97); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #btn-fetch  { background: #e05c00; color: #fff; }
    #btn-export { background: #fff; color: #333; border: 1.5px solid #ddd; }
    #btn-export:hover:not(:disabled) { border-color: #aaa; }

    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
      min-height: 18px;
    }
    .status.error { color: #c0392b; }

    /* ── Results ── */
    .zip-section { margin-bottom: 32px; }
    .zip-section h2 {
      font-size: 17px;
      color: #333;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff8f0;
      border-left: 4px solid #e05c00;
      padding: 9px 14px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .badge strong { color: #e05c00; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      font-size: 14px;
    }
    thead tr { background: #f7f7f7; }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      color: #999;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    th.right, td.right { text-align: right; }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      color: #444;
    }
    tr:last-child td { border-bottom: none; }
    td.price { font-weight: 700; color: #e05c00; }
    td.na    { color: #bbb; }
    tr:hover td { background: #fafafa; }

    #results { display: none; }

    #fetched-at {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 24px;
    }

    .zip-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .zip-row label {
      font-size: 14px;
      font-weight: 600;
      color: #555;
      white-space: nowrap;
    }
    .zip-row input {
      padding: 9px 12px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      width: 220px;
      outline: none;
      transition: border-color .15s;
    }
    .zip-row input:focus { border-color: #e05c00; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>⛽ Gas Price Tracker</h1>
    <p>87 Octane · enter ZIP codes below</p>
  </div>
</header>

<main>
  <div class="zip-row">
    <label for="zip-input">ZIP codes</label>
    <input id="zip-input" type="text" value="60014, 60012"
           placeholder="e.g. 60014, 60012" spellcheck="false" />
  </div>

  <div class="controls">
    <button id="btn-fetch">
      <span class="spinner" id="spinner"></span>
      <span id="fetch-label">Fetch Latest Prices</span>
    </button>
    <button id="btn-export" disabled>
      ⬇ Export CSV
    </button>
  </div>

  <div class="status" id="status"></div>

  <section id="results">
    <p id="fetched-at"></p>
    <div id="zip-sections"></div>
  </section>
</main>

<script>
  const btnFetch  = document.getElementById('btn-fetch');
  const btnExport = document.getElementById('btn-export');
  const spinner   = document.getElementById('spinner');
  const fetchLabel = document.getElementById('fetch-label');
  const statusEl  = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const fetchedAt = document.getElementById('fetched-at');
  const zipSections = document.getElementById('zip-sections');

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (isError ? ' error' : '');
  }

  function setLoading(loading) {
    btnFetch.disabled = loading;
    spinner.style.display = loading ? 'block' : 'none';
    fetchLabel.textContent = loading ? 'Fetching…' : 'Fetch Latest Prices';
  }

  function buildTable(rows) {
    const trs = rows.map(r => {
      const priceCell = r.price_87 === 'N/A'
        ? `<td class="right na">N/A</td>`
        : `<td class="right price">$${r.price_87}</td>`;
      return `<tr>
        <td>${escHtml(r.station)}</td>
        <td style="color:#666;font-size:13px">${escHtml(r.address)}</td>
        ${priceCell}
      </tr>`;
    }).join('');

    return `<table>
      <thead><tr>
        <th>Station</th>
        <th>Address</th>
        <th class="right">87 Oct</th>
      </tr></thead>
      <tbody>${trs}</tbody>
    </table>`;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  const zipInput = document.getElementById('zip-input');

  btnFetch.addEventListener('click', async () => {
    const zips = zipInput.value.split(',').map(z => z.trim()).filter(Boolean);
    if (!zips.length) {
      setStatus('Please enter at least one ZIP code.', true);
      return;
    }

    setLoading(true);
    setStatus('Fetching prices from GasBuddy… (this takes ~30 seconds)');
    zipSections.innerHTML = '';
    resultsEl.style.display = 'none';

    try {
      const res = await fetch('/api/fetch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ zip_codes: zips }),
      });
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.error || 'An error occurred.', true);
        setLoading(false);
        return;
      }

      // Render results
      fetchedAt.textContent = `Updated: ${data.date}`;
      let html = '';
      for (const [zip, rows] of Object.entries(data.by_zip)) {
        const priced = rows.filter(r => r.price_87 !== 'N/A');
        const badge = priced.length
          ? `<div class="badge">🏆 Best price: <strong>${escHtml(priced[0].station)}</strong> &mdash; <strong>$${priced[0].price_87}</strong></div>`
          : '';
        html += `<div class="zip-section">
          <h2>ZIP Code ${zip}</h2>
          ${badge}
          ${buildTable(rows)}
        </div>`;
      }
      zipSections.innerHTML = html;
      resultsEl.style.display = 'block';
      setStatus(`Found ${data.total} stations. Data saved to CSV.`);
      btnExport.disabled = false;
    } catch (err) {
      setStatus('Network error — is the server running?', true);
    }

    setLoading(false);
  });

  btnExport.addEventListener('click', () => {
    window.location.href = '/api/export';
  });

  // Enable export button if CSV already exists
  fetch('/api/history').then(r => r.json()).then(rows => {
    if (rows.length > 0) btnExport.disabled = false;
  });

  // Heartbeat — tells the server the browser tab is still open.
  // When the tab closes, pings stop and the server shuts itself down.
  function ping() { fetch('/api/ping', { method: 'POST' }).catch(() => {}); }
  ping();
  setInterval(ping, 5000);
</script>

</body>
</html>
